# Order API configuration. Secrets and addresses come from the environment.

# HS256 signing key, at least 32 bytes. No default on purpose: the API refuses to start without it.
api.jwt-secret=${JWT_SECRET}
api.jwt-issuer=risk-engine

api.kafka-bootstrap=${KAFKA_BOOTSTRAP:localhost:19092}
api.events-topic=engine-events
api.partitions=${ENGINE_PARTITIONS:4}

# Token bucket per user: a burst of `capacity` requests, refilled at `refill-per-second`.
api.rate-limit.capacity=20
api.rate-limit.refill-per-second=10
# How long a request id is remembered (a repeat inside this window is rejected with 409).
api.request-id-ttl=24h
api.max-order-qty=100000

# Order status is read from Postgres (the writers put it there). Plain JDBC, parameterised statements only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/risk}
spring.datasource.username=${DB_USER:risk}
spring.datasource.password=${DB_PASSWORD:risk}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=2000

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

# Strict JSON: unknown fields, "25" for 25, and 25.5 for a whole number are all errors, not guesses.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.default-property-inclusion=non_null

server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
spring.threads.virtual.enabled=true
