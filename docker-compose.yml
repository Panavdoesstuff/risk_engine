# The risk engine on one machine.
#
#   docker compose up -d                  infrastructure only: Postgres (+ migrations), Redpanda (+ topics), Redis
#   docker compose --profile app up -d    ... plus the engine: book loader, shard host, Postgres writers, order API,
#                                         outbox relay + fill ingester, a mock broker (BROKER_CHAOS=full|none),
#                                         Prometheus (:9090) and Grafana (:3000, dashboard "Risk engine")
#
# The engine services need a start-of-day book under ./data (see data/README.md), which is why they are
# behind a profile: the infrastructure must come up on a machine that has no data yet.
# scripts/m4-e2e.sh runs the whole thing end to end with synthetic data.
#
# Host ports can be moved with POSTGRES_PORT, REDPANDA_PORT, REDPANDA_ADMIN_PORT, REDIS_PORT, API_PORT,
# METRICS_PORT, BROKER_PORT, PROMETHEUS_PORT and GRAFANA_PORT, so a second copy (docker compose -p other ...) can run beside this one.

name: risk-engine

x-redpanda-image: &redpanda-image docker.redpanda.com/redpandadata/redpanda:v24.2.7

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: risk
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d risk"]
      interval: 2s
      timeout: 3s
      retries: 30

  flyway:
    image: flyway/flyway:10.20.1
    command: -url=jdbc:postgresql://postgres:5432/risk -user=risk -password=risk -connectRetries=30 migrate
    volumes: ["./db/migrations:/flyway/sql:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  redpanda:
    image: *redpanda-image
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_PORT:-19092}
    ports: ["${REDPANDA_PORT:-19092}:19092", "${REDPANDA_ADMIN_PORT:-9644}:9644"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 90   # up to three minutes: a cold CI runner can take a while to start the broker

  topic-init:
    image: *redpanda-image
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      RPK_BROKERS: redpanda:9092
      ENGINE_PARTITIONS: ${ENGINE_PARTITIONS:-4}
    volumes: ["./scripts/create-topics.sh:/scripts/create-topics.sh:ro"]
    depends_on:
      redpanda: { condition: service_healthy }
    restart: "no"

  redis:
    image: redis:7.4-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------- the engine (profile: app)

  # Puts the start-of-day book (the same files the shard host reads) into Postgres, once.
  book-loader:
    profiles: [app]
    build: .
    image: risk-engine-app
    command:
      - /opt/writers/bin/writers
      - load-book
      - --instruments
      - /data/${ENGINE_INSTRUMENTS:-processed/instruments-2024-06-03.csv}
      - --book
      - /data/${ENGINE_BOOK:-seed}
      - --jdbc-url
      - jdbc:postgresql://postgres:5432/risk
    volumes: ["${DATA_DIR:-./data}:/data:ro"]
    depends_on:
      flyway: { condition: service_completed_successfully }
    restart: "no"

  # One shard thread per engine-events partition. Lag metrics at :9100/metrics, health at :9100/healthz.
  shard-host:
    profiles: [app]
    image: risk-engine-app
    command:
      - /opt/host/bin/host
      - --instruments
      - /data/${ENGINE_INSTRUMENTS:-processed/instruments-2024-06-03.csv}
      - --book
      - /data/${ENGINE_BOOK:-seed}
      - --bootstrap
      - redpanda:9092
      - --partitions
      - "${ENGINE_PARTITIONS:-4}"
      - --metrics-port
      - "9100"
    volumes: ["${DATA_DIR:-./data}:/data:ro"]
    ports: ["${METRICS_PORT:-9100}:9100"]
    depends_on:
      book-loader: { condition: service_completed_successfully }
      topic-init: { condition: service_completed_successfully }

  # engine-out -> Postgres (positions, margin events, order status, audit log).
  writers:
    profiles: [app]
    image: risk-engine-app
    command: ["/opt/writers/bin/writers", "run", "--bootstrap", "redpanda:9092", "--jdbc-url", "jdbc:postgresql://postgres:5432/risk"]
    depends_on:
      book-loader: { condition: service_completed_successfully }
      topic-init: { condition: service_completed_successfully }

  # outbox -> broker (with timeout handling), and the broker's callbacks -> engine-events (the fill
  # ingester, which refuses any callback that does not match an order we placed).
  relay:
    profiles: [app]
    image: risk-engine-app
    command: ["/opt/writers/bin/writers", "relay", "--broker-url", "http://broker:9300", "--listen-port", "9200",
              "--partitions", "${ENGINE_PARTITIONS:-4}", "--bootstrap", "redpanda:9092", "--jdbc-url", "jdbc:postgresql://postgres:5432/risk"]
    depends_on:
      book-loader: { condition: service_completed_successfully }
      topic-init: { condition: service_completed_successfully }

  # A broker that misbehaves on purpose: 5% timeouts, 2% rejects, late and split fills, 10% duplicate callbacks.
  # Counters at :9300/stats.
  broker:
    profiles: [app]
    image: risk-engine-app
    command: ["/opt/broker-mock/bin/broker-mock", "--port", "9300", "--callback-url", "http://relay:9200/broker/callbacks",
              "--chaos", "${BROKER_CHAOS:-full}"]
    ports: ["${BROKER_PORT:-9300}:9300"]

  api:
    profiles: [app]
    image: risk-engine-app
    command: ["java", "-jar", "/opt/api/api.jar"]
    environment:
      # DEV ONLY. A fixed, published key: anyone who has this file can mint tokens for any account.
      # Fine on a laptop, never anywhere shared: set JWT_SECRET to something private there.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-do-not-deploy-0123456789}
      KAFKA_BOOTSTRAP: redpanda:9092
      ENGINE_PARTITIONS: ${ENGINE_PARTITIONS:-4}
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://postgres:5432/risk
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      book-loader: { condition: service_completed_successfully }
      topic-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # ---------------------------------------------------------------- monitoring (profile: app)

  prometheus:
    profiles: [app]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    profiles: [app]
    image: grafana/grafana:11.3.1
    environment:
      # DEV ONLY: anyone who can reach the port can view; the admin password is a published default.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/risk-engine.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  redpanda:
