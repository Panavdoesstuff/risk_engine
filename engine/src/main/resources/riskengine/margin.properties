# Margin model parameters. Every value here is an input you should be able to defend.
# Each is marked:
#   VERIFIED = checked against NSE Clearing's published rules in force on 3-4 June 2024
#   GUESS    = not checked, or not an NSE Clearing parameter at all (a model or broker choice)
# The day's own SPAN parameter file (nsccl.20240603.s.spn) could not be downloaded, so the VERIFIED values
# are the published rules, not the file. Where a rule is "statistical, subject to a minimum", the minimum
# is used; see docs/decisions.md (M7) for why the minimum almost certainly applied that day.
#
# Sources:
#   [CIRC] NSE Clearing circular NCL/CMPT/44391 (072/2020), 15 May 2020, effective 1 June 2020,
#          "Review of Margin framework for Futures & Options Segment", Annexure 1:
#          https://archives.nseindia.com/content/circulars/CMPT44391.pdf
#   [SPAN] NSE Clearing SPAN page (risk array scenarios):
#          https://www.nseindia.com/products/content/derivatives/equities/nsccl_span.htm
# See docs/decisions.md (M2, M7) for what each one means.

# Risk-free rate, continuously compounded. GUESS: ~91-day T-bill yield, June 2024.
rates.riskFree=0.069

# Only underlyings listed here are accepted. Nifty only until the end of M5.
underlyings=NIFTY

# Continuous dividend yield of the index. GUESS.
NIFTY.dividendYield=0.012
# Annual volatility = VIX level * volScale (Nifty: VIX / 100). GUESS (a model choice: SPAN files carry
# their own volatility per contract).
NIFTY.volScale=0.01
# Price scan range: the +/- move the 14 regular scenarios cover, as a fraction of spot.
# VERIFIED [CIRC 2]: index derivatives, 6 sigma scaled up by sqrt(2), at least 9.3% of the underlying.
# Not modelled: at least 17.7% for index options with more than 9 months to expiry.
NIFTY.priceScanRange=0.093
# Volatility scan range, in absolute vol (0.04 = +/- 4 vol points).
# VERIFIED [CIRC 3]: index derivatives, 25% of annualised EWMA volatility, at least 4%.
NIFTY.volScanRange=0.04
# Extreme scenarios 15-16: move = extremeMultiple * priceScanRange, loss counted at extremeCoverage.
# VERIFIED [SPAN]: "double the price scanning range (cover 35% of loss)".
NIFTY.extremeMultiple=2
NIFTY.extremeCoverage=0.35
# Short option minimum: fraction of underlying notional of all short options.
# VERIFIED [CIRC 5]: "no separate short option minimum charge for index derivatives" since 1 June 2020.
NIFTY.shortOptionMinimum=0
# Exposure (extreme loss) margin: fraction of notional of futures and short options (not long options).
# VERIFIED [CIRC 6]: index derivatives 2% of notional.
# Not modelled: 3% for index options more than 10% out of the money, 5% beyond 9 months to expiry,
# and one third of the far leg for calendar-spread futures.
NIFTY.exposureMargin=0.02
# Floor for scenario volatility after the down-shift. GUESS (a model guard, not an NSE parameter).
NIFTY.minVol=0.01

# Utilisation = required / available. Levels:
#   < warning -> OK, >= warning -> WARNING, >= marginCall -> MARGIN_CALL, >= squareOff -> SQUARE_OFF
# GUESS: these are a broker's risk policy, not NSE Clearing parameters.
thresholds.warning=0.80
thresholds.marginCall=1.00
thresholds.squareOff=1.20
# MARGIN_CALL and SQUARE_OFF need this many consecutive ticks at or above their threshold. GUESS (policy).
thresholds.confirmTicks=3
