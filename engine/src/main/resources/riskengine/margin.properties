# Margin model parameters. Every value here is an input you should be able to defend.
# GUESS = not yet checked against NSE Clearing's published parameters for 3-4 June 2024.
# See docs/decisions.md (M2) for what each one means.

# Risk-free rate, continuously compounded. GUESS: ~91-day T-bill yield, June 2024.
rates.riskFree=0.069

# Only underlyings listed here are accepted. Nifty only until the end of M5.
underlyings=NIFTY

# Continuous dividend yield of the index. GUESS.
NIFTY.dividendYield=0.012
# Annual volatility = VIX level * volScale (Nifty: VIX / 100).
NIFTY.volScale=0.01
# Price scan range: the +/- move the 14 regular scenarios cover, as a fraction of spot. GUESS.
NIFTY.priceScanRange=0.09
# Volatility scan range, in absolute vol (0.04 = +/- 4 vol points). GUESS.
NIFTY.volScanRange=0.04
# Extreme scenarios 15-16: move = extremeMultiple * priceScanRange, loss counted at extremeCoverage. GUESS.
NIFTY.extremeMultiple=2
NIFTY.extremeCoverage=0.35
# Short option minimum: fraction of underlying notional of all short options. GUESS.
NIFTY.shortOptionMinimum=0.03
# Exposure margin: fraction of notional of futures and short options (not long options). GUESS.
NIFTY.exposureMargin=0.02
# Floor for scenario volatility after the down-shift.
NIFTY.minVol=0.01

# Utilisation = required / available. Levels:
#   < warning -> OK, >= warning -> WARNING, >= marginCall -> MARGIN_CALL, >= squareOff -> SQUARE_OFF
thresholds.warning=0.80
thresholds.marginCall=1.00
thresholds.squareOff=1.20
# MARGIN_CALL and SQUARE_OFF need this many consecutive ticks at or above their threshold. GUESS.
thresholds.confirmTicks=3
